<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的待办 A</title>
<meta name="description" content="Demo A：路由任务流 + 常驻检查面板">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316181b'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='%233cb3a4' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
<style>
/* Shape rule: floating layers 10px / controls and rows 6px / tags 4px / docked panes 0.
   Checks: circle = my task, 4px square = synced checklist item.
   Color rule: teal = interaction + progress, red = needs you now (P0, overdue, 待修), amber = backup warning only. */
:root{
  --bg:#f5f6f7; --pane:#ffffff; --sunk:#eef0f2; --hover:#eaedf0; --line:#e2e5e8; --line2:#d2d7dc;
  --ink:#16181b; --ink2:#41464e; --muted:#646a73;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#e1efed;
  --signal:#c4432c; --signal-soft:#fbe9e5; --warn:#8f5c0e; --warn-soft:#f6eedd;
  --scrim:rgb(22 24 27 / .28);
  --shadow-pop:0 2px 6px rgb(22 30 38 / .06),0 18px 44px rgb(22 30 38 / .16);
  --r-pop:10px; --r-ctl:6px; --r-tag:4px;
  --ease:cubic-bezier(.16,1,.3,1);
  --font:"Geist",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --insp:clamp(360px,30vw,440px);
  --z-sheet:20; --z-pop:30; --z-toast:40;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1113; --pane:#16191c; --sunk:#1d2125; --hover:#1f2327; --line:#272b30; --line2:#363c42;
    --ink:#e8eaed; --ink2:#c1c6cc; --muted:#8e959d;
    --accent:#3cb3a4; --accent-ink:#0b1f1c; --accent-soft:#15302c;
    --signal:#ec6a52; --signal-soft:#3a201b; --warn:#d9a441; --warn-soft:#352c1c;
    --scrim:rgb(0 0 0 / .5);
    --shadow-pop:0 2px 6px rgb(0 0 0 / .4),0 18px 44px rgb(0 0 0 / .5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1113; --pane:#16191c; --sunk:#1d2125; --hover:#1f2327; --line:#272b30; --line2:#363c42;
  --ink:#e8eaed; --ink2:#c1c6cc; --muted:#8e959d;
  --accent:#3cb3a4; --accent-ink:#0b1f1c; --accent-soft:#15302c;
  --signal:#ec6a52; --signal-soft:#3a201b; --warn:#d9a441; --warn-soft:#352c1c;
  --scrim:rgb(0 0 0 / .5);
  --shadow-pop:0 2px 6px rgb(0 0 0 / .4),0 18px 44px rgb(0 0 0 / .5);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13.5px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-ctl)}
.ph{font-size:1.1em;line-height:1;vertical-align:-.13em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-40px;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:var(--r-ctl);z-index:50;text-decoration:none}
.skip:focus{top:8px}

.app{display:grid;grid-template-rows:48px minmax(0,1fr) 28px;height:100dvh}

/* Top bar */
.top{display:flex;align-items:stretch;gap:8px;padding:0 12px 0 14px;border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;letter-spacing:-.01em;padding-right:10px;flex-shrink:0}
.logo{width:24px;height:24px;border-radius:var(--r-ctl);background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px}
.mtitle{display:none;align-items:center;font-weight:600;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;align-items:stretch;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;border:0;background:none;color:var(--ink2);padding:0 10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border-radius:0;transition:color .15s var(--ease)}
.tab:hover{color:var(--ink)}
.tab .n{font:500 11.5px var(--mono);color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab[aria-current="page"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px 2px 0 0}
.tab:focus-visible{outline-offset:-4px}
.tsep{width:1px;background:var(--line);margin:14px 4px}
.tsp{flex:1}
.searchbtn{align-self:center;display:flex;align-items:center;gap:8px;height:32px;width:240px;padding:0 8px 0 10px;border:1px solid var(--line);background:var(--pane);border-radius:var(--r-ctl);color:var(--muted);font-size:13px;flex-shrink:0;transition:border-color .15s var(--ease)}
.searchbtn:hover{border-color:var(--line2);color:var(--ink2)}
.searchbtn .lbl{flex:1;text-align:left}
kbd{font:500 11px var(--mono);color:var(--muted);background:var(--sunk);border-radius:var(--r-tag);padding:1px 5px}

/* Main split */
.main{display:grid;grid-template-columns:minmax(0,1fr) var(--insp);min-height:0}
.stream{overflow-y:auto;min-width:0;scroll-behavior:smooth}
.sin{max-width:880px;margin:0 auto;padding:14px 28px 56px;container-type:inline-size}
.insp{background:var(--pane);border-left:1px solid var(--line);overflow-y:auto;min-width:0}
.scrim{display:none}

/* Week strip */
.week{display:flex;align-items:stretch;gap:6px;margin-bottom:12px}
.days{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.day{position:relative;border:0;background:transparent;border-radius:var(--r-ctl);padding:5px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink2);transition:background .15s var(--ease)}
.day:hover{background:var(--hover)}
.day .dw{font-size:11px;color:var(--muted)}
.day .dn{font-size:13.5px;font-weight:500}
.day .dc{position:absolute;top:3px;right:calc(50% - 20px);font-size:10.5px;font-weight:600;color:var(--accent)}
.day.today .dn{color:var(--accent);font-weight:600}
.day.today::after{content:"";position:absolute;left:30%;right:30%;bottom:1px;height:2px;border-radius:2px;background:var(--accent)}
.day.on{background:var(--pane);box-shadow:inset 0 0 0 1px var(--line2)}
.wbtn{border:0;background:transparent;border-radius:var(--r-ctl);padding:0 10px;color:var(--ink2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:12.5px}
.wbtn:hover{background:var(--hover)}
.wbtn.over{color:var(--signal)}
.wbtn.over b{font-family:var(--mono)}

/* Quick add */
.qa{display:flex;align-items:center;gap:6px;background:var(--pane);border:1px solid var(--line);border-radius:var(--r-pop);padding:6px 6px 6px 12px;margin-bottom:18px;transition:border-color .15s var(--ease)}
.qa:focus-within{border-color:var(--accent)}
.qa .ph-plus{color:var(--muted)}
.qa input.qt{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14px;padding:5px 0}
.qa input.qt::placeholder{color:var(--muted)}
.qopts{display:flex;align-items:center;gap:4px}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-ctl);padding:4px 6px;font-size:12.5px;color:var(--ink2);outline:none;max-width:120px}
.pill:focus-visible{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}
.pill.set{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:var(--r-ctl);padding:6px 14px;font-size:13px;font-weight:600;transition:filter .15s var(--ease),transform .1s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.gbtn{border:1px solid var(--line);background:var(--pane);border-radius:var(--r-ctl);padding:5px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;color:var(--ink2);transition:border-color .15s var(--ease),color .15s}
.gbtn:hover{border-color:var(--line2);color:var(--ink)}
.gbtn:active{transform:translateY(1px)}
.gbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.gbtn.danger:hover{border-color:var(--signal);color:var(--signal)}

/* List header */
.lh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 10px;flex-wrap:wrap}
.lh h1{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.25;display:flex;align-items:baseline;gap:8px}
.lh h1 .num{font-size:14px;color:var(--muted);font-weight:500}
.lh .desc{color:var(--muted);font-size:12.5px;margin-top:2px}
.seg{display:inline-flex;background:var(--sunk);border-radius:var(--r-ctl);padding:2px}
.seg button{border:0;background:transparent;border-radius:4px;padding:4px 10px;font-size:12.5px;color:var(--muted);white-space:nowrap;transition:background .15s var(--ease),color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--pane);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgb(22 30 38 / .08)}
.sech{font-size:12.5px;font-weight:600;color:var(--muted);margin:22px 0 6px;display:flex;align-items:center;gap:6px}
.sech:first-child{margin-top:4px}
.sech .num{font-weight:500}
.filterbar{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12.5px;color:var(--muted)}

/* Rows */
.items{display:flex;flex-direction:column;gap:1px}
.row{display:flex;align-items:flex-start;gap:12px;padding:9px 12px;border-radius:var(--r-ctl);cursor:pointer;transition:background .15s var(--ease),box-shadow .15s var(--ease);min-width:0}
.row:hover{background:var(--hover)}
.row.sel{background:var(--pane);box-shadow:inset 2px 0 0 var(--accent),0 0 0 1px var(--line)}
.row:focus-visible{outline-offset:-2px}
.ck{width:18px;height:18px;margin-top:2px;flex-shrink:0;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--muted) 60%,transparent);background:transparent;display:grid;place-items:center;transition:background .18s var(--ease),border-color .18s var(--ease)}
.ck:hover{border-color:var(--accent);background:var(--accent-soft)}
.row.done .ck{background:var(--accent);border-color:var(--accent)}
.row.done .ck::after,.sq.on::after{content:"";width:4px;height:8px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.rb{flex:1;min-width:0}
.rt{font-size:14.5px;font-weight:500;letter-spacing:-.005em;overflow-wrap:anywhere}
.row.done .rt{color:var(--muted);text-decoration:line-through;font-weight:400}
.rm{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:4px}
.rnext{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;color:var(--accent);margin-top:4px}
.rnext span{color:var(--ink2);overflow-wrap:anywhere}
.rsync{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;margin-top:3px;white-space:nowrap}
.tg{font-size:11.5px;line-height:1.6;padding:0 6px;border-radius:var(--r-tag);background:var(--sunk);color:var(--ink2);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tg b{font-family:var(--mono);font-weight:600}
.tg.sig{background:var(--signal-soft);color:var(--signal)}
.tg.over{background:transparent;color:var(--signal);padding-left:0}
.tg.soon{background:transparent;color:var(--ink2);padding-left:0}
.tg.ghost{background:transparent;color:var(--muted);padding-left:0}
.tg.sample{background:transparent;box-shadow:inset 0 0 0 1px var(--line2);color:var(--muted)}
.tg.unk{background:transparent;border:1px dashed var(--line2);color:var(--ink2);padding:0 5px}
.pri{font:600 11px/1 var(--mono);padding:3px 5px;border-radius:var(--r-tag)}
.pri.P0{background:var(--signal-soft);color:var(--signal)}
.pri.P1{box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink2)}
.pri.P2{color:var(--muted);padding-left:0;padding-right:2px}
.prog{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--accent);font-weight:600}
.segs{display:inline-flex;gap:2px}
.segs i{width:7px;height:4px;border-radius:1px;background:var(--line2)}
.segs i.f{background:var(--accent)}

/* Child rows (routed synced items) */
.kids{margin:0 0 6px 42px;display:flex;flex-direction:column;gap:0;min-width:0}
.knext{display:flex;align-items:flex-start;gap:7px;font-size:13px;color:var(--accent);padding:2px 8px 4px}
.knext span{color:var(--ink)}
.kid{display:flex;align-items:flex-start;gap:9px;padding:4px 8px;border-radius:var(--r-ctl);font-size:13px;color:var(--ink2);cursor:pointer;transition:background .15s var(--ease);min-width:0}
.kid:hover{background:var(--hover)}
.kid:focus-visible{outline-offset:-2px}
.kid .kt{flex:1;min-width:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kid.done .kt{color:var(--muted);text-decoration:line-through}
.kid.locked{cursor:default}
.kid .kg{font-size:11.5px;color:var(--muted);white-space:nowrap;margin-top:1px}
.kid .kg.fix{color:var(--signal)}
.sq{width:15px;height:15px;margin-top:2.5px;flex-shrink:0;border-radius:var(--r-tag);border:1.5px solid color-mix(in srgb,var(--muted) 60%,transparent);display:grid;place-items:center;transition:background .18s var(--ease),border-color .18s var(--ease)}
.kid:hover .sq:not(.on),.ci.can:hover .sq:not(.on){border-color:var(--accent)}
.sq.on{background:var(--accent);border-color:var(--accent)}
.sq.on::after{width:3.5px;height:7px;border-width:0 1.5px 1.5px 0}
.kmore{align-self:flex-start;border:0;background:transparent;color:var(--accent);font-size:12.5px;padding:3px 8px;border-radius:var(--r-ctl);display:inline-flex;align-items:center;gap:4px}
.kmore:hover{background:var(--hover)}
code{font:12px var(--mono);background:var(--sunk);padding:0 4px;border-radius:var(--r-tag)}
a{color:var(--accent);text-underline-offset:2px}

/* Folded read-only references */
.ref{margin-top:22px;border-top:1px solid var(--line);padding-top:10px}
.ref summary{cursor:pointer;font-size:12.5px;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px;padding:4px 0;border-radius:var(--r-ctl)}
.ref summary::-webkit-details-marker{display:none}
.ref[open] summary .ph-caret-right{transform:rotate(90deg)}
.ref summary .ph{transition:transform .15s var(--ease)}
.refg{margin:8px 0 4px 20px}
.refg h4{font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:2px}
.refi{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink2);padding:3px 0}
.refi .rtx{flex:1;min-width:0;overflow-wrap:anywhere}

/* Today feed */
.feed{list-style:none;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 10px;padding:7px 12px;border-radius:var(--r-ctl)}
.feed time{font:11.5px/1.9 var(--mono);color:var(--muted)}
.feed .fw{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.feed .fw button{border:0;background:none;color:var(--ink2);font-size:12px;padding:0;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:2px}
.feed .fw button:hover{color:var(--accent)}
.feed .ft{font-size:13px;overflow-wrap:anywhere}
.p0head{font-size:13px;font-weight:500;margin:8px 0 2px 12px;display:flex;gap:8px;align-items:center}

/* Matrix lens */
.mx{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.mxr{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(150px,1.5fr) repeat(5,50px) 84px 48px;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);min-width:0}
.mxr.h{font-size:11.5px;color:var(--muted);padding-top:8px;padding-bottom:8px}
.mxr.b{cursor:pointer;border-radius:0;transition:background .15s var(--ease)}
.mxr.b:hover{background:var(--hover)}
.mxr.b.sel{background:var(--pane);box-shadow:inset 2px 0 0 var(--accent)}
.mxr .c{text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
.mxr .c.z{color:var(--muted);opacity:.6}
.mxr .c.hot{color:var(--signal);font-weight:600}
.mxr .r{text-align:right;font:11.5px var(--mono);color:var(--muted)}
.mxn{font-weight:500;min-width:0;overflow-wrap:anywhere;line-height:1.5}
.mxn .pri{margin-right:6px;vertical-align:1px}
.mxn .tg{margin-left:6px;vertical-align:1px}
.mxs{font-size:12.5px;color:var(--ink2);overflow-wrap:anywhere}
.mxl{display:none}
@container (max-width:720px){
  .mxr.h{display:none}
  .mxr{grid-template-columns:1fr;gap:4px;padding:12px}
  .mxr .c,.mxr .r{display:none}
  .mxl{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
  .mxl b{font-family:var(--mono);color:var(--ink2);font-weight:600}
  .mxl .hot b{color:var(--signal)}
}

/* Docs list */
.drow{display:flex;gap:12px;padding:10px 12px;border-radius:var(--r-ctl);cursor:pointer;transition:background .15s var(--ease)}
.drow:hover{background:var(--hover)}
.drow.sel{background:var(--pane);box-shadow:inset 2px 0 0 var(--accent),0 0 0 1px var(--line)}
.drow .ph-file-text{font-size:20px;color:var(--muted);margin-top:1px}
.drow .snip{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Empty */
.empty{text-align:center;color:var(--muted);padding:56px 16px}
.empty .ph{font-size:30px;display:block;margin:0 auto 10px;opacity:.7}
.empty .hint{font-size:12.5px;margin-top:4px}

/* Inspector */
.ih{position:sticky;top:0;background:var(--pane);z-index:1;display:flex;align-items:flex-start;gap:8px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.iback{display:none;border:0;background:transparent;color:var(--muted);padding:4px;border-radius:var(--r-ctl);font-size:18px;margin-top:1px}
.iback:hover{background:var(--sunk);color:var(--ink)}
.ititle{flex:1;min-width:0;border:0;background:transparent;font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.4;resize:none;outline:none;overflow:hidden;border-radius:var(--r-ctl)}
.ititle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ibody{padding:14px 20px 40px;display:flex;flex-direction:column;gap:20px}
.ibody.fade{animation:fadein .2s var(--ease)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.stage{font-size:13px;color:var(--ink2);text-wrap:pretty}
.src{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.ctl{display:flex;flex-wrap:wrap;gap:6px}
.ctl select,.ctl input{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-ctl);padding:5px 8px;font-size:12.5px;color:var(--ink);outline:none}
.ctl select:focus-visible,.ctl input:focus-visible{border-color:var(--accent)}
.isec h3{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.isec h3 .num{font-weight:500}
.isec h3 .sp{flex:1}
.ifield{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-ctl);padding:8px 10px;font-size:13.5px;outline:none;transition:border-color .15s var(--ease)}

function kindOf(title) {
  if (/待修|bug|阻塞|风险/i.test(title)) return "fix";
  if (/我要做|我来|我的/.test(title)) return "act";
  if (/等别人|等待|依赖/.test(title)) return "watch";
  if (/上线前|检查/.test(title)) return "gate";
  if (/上线后|以后|后续|将来/.test(title)) return "later";
  return "unknown";
}
const KIND_LABEL = { fix: "待修", act: "我要做", watch: "等别人", gate: "上线前", later: "上线后" };
function parseSync(md) {
  const summary = [], groups = []; let cur = null, inCode = false;
  String(md || "").replace(/\r/g, "").split("\n").forEach(ln => {
    if (/^\s*```/.test(ln)) { inCode = !inCode; return; }
    if (inCode || !ln.trim()) return;
    let m;
    if ((m = ln.match(/^#{2,4}\s+(.*)/))) { const title = clean(m[1]).replace(/^[^\p{L}\p{N}]+/u, "").trim(); cur = { title, kind: kindOf(title), items: [] }; groups.push(cur); return; }
    const item = (m = ln.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)/)) ? { text: m[2], check: true, up: m[1] !== " " }
      : (m = ln.match(/^\s*(?:[-*]|\d+[.)])\s+(.*)/)) ? { text: m[1], check: false } : { text: ln.trim(), check: false };
    if (cur) cur.items.push(item); else summary.push(ln.trim());

}
const info = t => t.sync ? (t._p && t._p.src === t.sync.syncNote ? t._p.v : (t._p = { src: t.sync.syncNote, v: parseSync(t.sync.syncNote) }).v) : null;

}

  const r = { P0: 0, P1: 1, P2: 2, "": 3 };

function sortTasks(arr) {

// ===== Quick add with tokens =====
function parseDue(w) {
  const wd = { "周一": 1, "周二": 2, "周三": 3, "周四": 4, "周五": 5, "周六": 6, "周日": 0, "周天": 0 };
  if (w === "今天") return TODAY; if (w === "明天") return addDays(1); if (w === "后天") return addDays(2);
  if (w in wd) { let diff = (wd[w] - NOW.getDay() + 7) % 7; return addDays(diff); }
  const m = w.match(/^(\d{1,2})[/-](\d{1,2})$/);
  if (m && +m[1] >= 1 && +m[1] <= 12 && +m[2] >= 1 && +m[2] <= 31) return `${NOW.getFullYear()}-${p2(+m[1])}-${p2(+m[2])}`;
  return "";
}
function parseTokens(s) {
  const r = { text: [], pri: "", ctx: "", due: "" };
  s.split(/\s+/).forEach(w => {
    let m;
    if (/^p[0-2]$/i.test(w)) r.pri = w.toUpperCase();
    else if (/^@[^\s@]{1,12}$/.test(w)) r.ctx = w;
    else if ((m = w.match(/^\^(\S+)$/)) && parseDue(m[1])) r.due = parseDue(m[1]);
    else if (w) r.text.push(w);
  });
  r.text = r.text.join(" ");
  return r;
}

  const qt = f.querySelector("#qt"), qp = f.querySelector("#qpri"), qc = f.querySelector("#qctx"), qd = f.querySelector("#qdue");
  const mark = () => [qp, qc, qd].forEach(x => x.classList.toggle("set", !!x.value));
  qt.addEventListener("input", () => {
    const r = parseTokens(qt.value);
    if (r.pri) qp.value = r.pri;
    if (r.ctx) { if (![...qc.options].some(o => o.value === r.ctx)) qc.add(new Option(r.ctx, r.ctx)); qc.value = r.ctx; }
    if (r.due) qd.value = r.due;

  });
  [qp, qc, qd].forEach(x => x.addEventListener("change", mark));
  mark();
  f.onsubmit = e => {
    e.preventDefault();
    const r = parseTokens(qt.value); if (!r.text) { qt.focus(); return; }
    const list = TASK_LISTS.includes(view) ? view : "inbox";
    const t = { id: uid("t"), text: r.text.slice(0, 200), list, pri: qp.value, ctx: qc.value, due: qd.value, next: "", note: "", log: [], done: false, created: Date.now() };

}

let toastTimer;
function toast(msg, undo) {
  let el = document.getElementById("toast"); if (el) el.remove();
  el = document.createElement("div"); el.className = "toast"; el.id = "toast"; el.setAttribute("role", "status");
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">撤销</button>' : ""}`;
  if (undo) el.querySelector("button").onclick = () => { undo(); el.remove(); };
  document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 3600);
}

// ===== Actions =====
function renderAll() { renderTop(); renderStream(); renderInspector(); renderStatus(); }
function select(id, kind) {
  selKind = kind || "task"; selId = id; delArm = null;
  if (narrow()) inspOpen = true;
  renderStream(); renderInspector();
}
function visibleRows() { return [...document.querySelectorAll("#sin .row[data-id], #sin .mxr.b[data-id], #sin .drow[data-id]")]; }
function setView(v) {
  view = v; dayFilter = null; delArm = null; inspOpen = false; justTicked.clear();
  if (v === "docs") { selKind = "doc"; selId = docs.length ? docs[0].id : null; docEdit = false; }
  else { selKind = "task"; renderTop(); renderStream(); const first = visibleRows()[0]; selId = first ? first.dataset.id : null; }
  renderAll();
  document.getElementById("stream").scrollTop = 0;
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (e.target.closest("a")) return;
  const a = el.dataset.act, id = el.dataset.id;
  if ((a === "palclose" || a === "closelayer") && e.target !== el) return;
  switch (a) {
    case "view": closeLayer(); setView(el.dataset.v); break;
    case "projects": closeLayer(); setView("next"); lens.next = "matrix"; renderStream(); break;
    case "more": openMore(); break;
    case "select": if (e.target.closest(".ck")) return; select(id, "task"); break;
    case "seldoc": docEdit = false; select(id, "doc"); break;
    case "done": {
      e.stopPropagation();
      const t = task(id); t.done = !t.done; if (t.done) t.doneAt = Date.now();
      renderAll();
      if (t.done) toast(`已完成：${t.text}`, () => { t.done = false; renderAll(); });
      break;
    }
    case "tick": {
      const t = task(id), k = el.dataset.k; t.checks = t.checks || {};
      if (t.checks[k]) delete t.checks[k]; else { t.checks[k] = true; justTicked.add(id + "|" + k); }
      renderTop(); renderStream(); renderInspector();
      const again = document.querySelector(`[data-act="tick"][data-id="${id}"][data-k="${CSS.escape(k)}"]`); if (again && document.activeElement === document.body) again.focus();
      break;
    }
    case "expand": expanded.has(id) ? expanded.delete(id) : expanded.add(id); renderStream(); break;
    case "lens": lens[view] = el.dataset.l; renderStream(); break;
    case "day": { const d = el.dataset.d; dayFilter = dayFilter === d ? null : d; closeLayer(); renderTop(); renderStream(); break; }
    case "month": openMonth(el); break;
    case "mnav": calM += Number(el.dataset.m); if (calM < 0) { calM = 11; calY--; } if (calM > 11) { calM = 0; calY++; } openMonth.redraw(); break;
    case "palette": openPalette(); break;
    case "palclose": case "closelayer": closeLayer(); break;
    case "palgo": palGo(palRes[Number(el.dataset.i)]); break;
    case "closeInsp": inspOpen = false; renderInspector(); break;
    case "raworder": rawOrder = !rawOrder; renderInspector(); break;
    case "adopt": {
      const src = task(id), text = clean(el.dataset.k).replace(/`/g, "");
      const t = { id: uid("t"), text, list: "waiting", pri: "", ctx: "", due: "", next: "", note: `来自项目：${src.text}`, log: [], done: false, created: Date.now() };
      tasks.push(t); src.adopted = src.adopted || {}; src.adopted[el.dataset.k] = true; renderTop(); renderStream(); renderInspector();
      toast("已转成等待中的任务", () => { tasks = tasks.filter(x => x.id !== t.id); delete src.adopted[el.dataset.k]; renderAll(); });
      break;
    }
    case "addlog": addLog(); break;
    case "chip": { const li = document.getElementById("iLog"); li.value = el.dataset.p; li.focus(); break; }
    case "dellog": { const t = task(selId), ts = Number(el.dataset.t); t.log = t.log.filter(x => x.sync || x.t !== ts); renderInspector(); renderStream(); break; }
    case "del": {
      if (delArm !== id) { delArm = id; renderInspector(); break; }
      const t = task(id), idx = tasks.indexOf(t); tasks = tasks.filter(x => x.id !== id); delArm = null; selId = null; inspOpen = false; renderAll();
      toast(`已删除：${t.text}`, () => { tasks.splice(idx, 0, t); selId = t.id; renderAll(); });
      break;
    }
    case "newdoc": { const d = { id: uid("d"), title: "", cat: "", body: "", updated: NOW.getTime() }; docs.push(d); docEdit = true; select(d.id, "doc"); const ti = document.getElementById("dTitle"); if (ti) ti.focus(); break; }
    case "docedit": docEdit = !docEdit; renderInspector(); break;
    case "deldoc": {
      if (delArm !== id) { delArm = id; renderInspector(); break; }
      docs = docs.filter(x => x.id !== id); delArm = null; selId = docs.length ? docs[0].id : null; renderAll(); break;
    }
    case "export": closeLayer(); toast("演示页不会真的下载，正式版导出 JSON 备份"); break;
  }
});
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); return; }
  if (e.key === "Escape") {
    if (document.getElementById("layer").innerHTML) { closeLayer(); return; }
    if (inspOpen) { inspOpen = false; renderInspector(); return; }
    if (typing) e.target.blur();
    return;
  }
  const act = e.target.closest && e.target.closest('[role="checkbox"][data-act],[role="button"][data-act]');
  if (act && !typing && (e.key === "Enter" || e.key === " ") && act.tagName !== "BUTTON") { e.preventDefault(); act.click(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); openPalette(); }
  else if (e.key === "c") { const q = document.getElementById("qt"); if (q) { e.preventDefault(); q.focus(); } }
  else if (e.key === "j" || e.key === "k") {
    const rows = visibleRows(); if (!rows.length) return;
    let i = rows.findIndex(r => r.dataset.id === selId); i = e.key === "j" ? Math.min(i + 1, rows.length - 1) : Math.max(i - 1, 0);
    const r = rows[i]; selKind = r.classList.contains("drow") ? "doc" : "task"; selId = r.dataset.id; delArm = null;
    renderStream(); renderInspector();
    const n = document.querySelector(`#sin [data-id="${CSS.escape(selId)}"]`); if (n) { n.focus({ preventScroll: true }); n.scrollIntoView({ block: "nearest" }); }
  }
  else if (e.key === "x" && selKind === "task" && task(selId)) { const b = document.createElement("button"); b.dataset.act = "done"; b.dataset.id = selId; document.body.appendChild(b); b.click(); b.remove(); }
});
window.matchMedia("(max-width:1179px)").addEventListener("change", () => { inspOpen = false; renderInspector(); });

// ?theme=dark|light forces a theme (for review); default follows the system
const th = new URLSearchParams(location.search).get("theme");
if (th === "dark" || th === "light") document.documentElement.dataset.theme = th;
// Phone: project children collapse to the one-line summary by default
if (window.matchMedia("(max-width:759px)").matches) lens.next = "tasks";
renderAll();
</script>
</body>
